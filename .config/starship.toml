# Generated by caelestia from the current wallpaper.
# Edit the template instead: ~/.config/caelestia/templates/starship.toml
"$schema" = 'https://starship.rs/config-schema.json'

palette = "wall"
add_newline = true

format = """
[](fg:accent)\
$os\
[](fg:accent bg:sel)\
$directory\
[](fg:sel bg:alt)\
$git_branch$git_status\
[](fg:alt)\
$fill\
$nodejs$python$rust$golang$java$c$lua\
$cmd_duration\
$time
$character"""

[palettes.wall]
accent    = "#c2c1ff"
on_accent = "#2a2a60"
sel       = "#45455c"
on_sel    = "#b4b2ce"
alt       = "#2a292e"
fg        = "#e5e1e7"
dim       = "#c8c5d1"
tert      = "#f5b2e0"
err       = "#ffb4ab"

[os]
disabled = false
style = "fg:on_accent bg:accent"
format = "[$symbol ]($style)"
[os.symbols]
Arch = "󰣇"
Linux = ""

[directory]
style = "fg:on_sel bg:sel"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = "󰝚"
"Pictures" = ""
"Projects" = ""
".config" = ""

[git_branch]
symbol = ""
style = "fg:tert bg:alt"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "fg:tert bg:alt"
format = "[($all_status$ahead_behind )]($style)"

[fill]
symbol = " "

[nodejs]
symbol = ""
format = "[ $symbol $version ](fg:dim)"
[python]
symbol = ""
format = "[ $symbol $version( \\($virtualenv\\)) ](fg:dim)"
[rust]
symbol = ""
format = "[ $symbol $version ](fg:dim)"
[golang]
symbol = ""
format = "[ $symbol $version ](fg:dim)"
[java]
symbol = ""
format = "[ $symbol $version ](fg:dim)"
[c]
symbol = ""
format = "[ $symbol $version ](fg:dim)"
[lua]
symbol = ""
format = "[ $symbol $version ](fg:dim)"

[cmd_duration]
min_time = 2000
format = "[ 󱦟 $duration ](fg:dim)"

[time]
disabled = false
time_format = "%H:%M"
format = "[ 󰥔 $time](fg:dim)"

[character]
success_symbol = "[❯](bold fg:accent)"
error_symbol   = "[❯](bold fg:err)"
vimcmd_symbol  = "[❮](bold fg:tert)"
